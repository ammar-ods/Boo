<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <rect width="800" height="800" fill="#efe8de"/>
  <text x="400" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#333">Unfolded mug wrap</text>
  <text x="400" y="122" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#8a7b6c">Print this panel · left seam to right seam is one full turn</text>
  <rect x="70" y="210" width="660" height="300" rx="10" fill="#fffdf9" stroke="#333" stroke-width="3"/>
  <path d="M70 210h660M70 510h660" stroke="#32B7B2" stroke-width="6"/>
  <path d="M400 210v300" stroke="#F99B36" stroke-width="2" stroke-dasharray="7 8"/>
  <path d="M70 210v300M730 210v300" stroke="#F96C9F" stroke-width="3"/>
  <text x="400" y="248" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#F99B36">FRONT</text>
  <text x="88" y="368" font-family="Georgia, serif" font-size="13" fill="#F96C9F">SEAM</text>
  <text x="712" y="368" text-anchor="end" font-family="Georgia, serif" font-size="13" fill="#F96C9F">SEAM</text>
  <text x="235" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#999">← toward handle</text>
  <text x="565" y="500" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#999">toward handle →</text>
  <text x="400" y="560" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#8a7b6c">Artwork in this rectangle is what gets printed around the mug.</text>
  <text x="400" y="584" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#8a7b6c">Center = customer-facing front. Edges meet at the handle seam.</text>
</svg>
